name: Feature request
description: Propose a new feature or capability
title: "[Feature] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Thanks for the suggestion. Help us understand what you need.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve?
      placeholder: "When I try to..., I cannot..."
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What would you like to be able to do?
      placeholder: "It would be helpful if..."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: "What other approaches did you think of? Why are they not ideal?"
      placeholder: "I could..., but that would require..."
    validations:
      required: false
