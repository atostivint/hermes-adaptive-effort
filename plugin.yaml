# Hermes Adaptive Effort: user-controlled reasoning-effort routing.
# See README.md for the verified
# access paths and fail-open rules; enable only via plugins.entries settings.
name: hermes-adaptive-effort
id: hermes-adaptive-effort
kind: standalone
version: 0.6.0
description: >
  A Hermes plugin that uses a System One decision model to set the reasoning
  effort of each request. You choose the scorer: Jev, OpenAI Decisions,
  OpenRouter, Cloudflare Clef, Nace Drex, a local Ollama model, or your own
  endpoint. The plugin rewrites only a supported effort field on exact
  registered routes; other routes stay unchanged. Default mode is off and Jev
  remains the default scorer.
