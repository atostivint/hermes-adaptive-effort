hae.usage: "Uso:\n  /hae                                      Mostrar el historial de esfuerzo de esta conversación\n  /hae history [N|all] [full]               Mostrar cambios recientes de esfuerzo aplicados\n  /hae status                               Mostrar un estado conciso para esta conversación\n  /hae status full                          Mostrar estado detallado para esta conversación\n  /hae status json                          Carga útil de estado legible por máquina\n  /hae auto|once|always|off                  Establecer el modo usado por las futuras solicitudes\n  /hae auto|once|always|off here            Establecer el modo solo para esta conversación\n  /hae default here                         Limpiar el modo de esta conversación (usar el predeterminado)\n  /hae probe <text>                         Clasificar <text> una vez (imprime puntuación/etiqueta, no almacena nada)\n  /hae cache                                Diagnóstico de pérdida de caché para los últimos 7 días\n  /hae cache json                           Diagnóstico de caché legible por máquina\n  /hae help                                 Mostrar esta ayuda\n\nHistorial:\n  La vista predeterminada muestra 10 cambios aplicados. N es 1–64; all muestra los cambios retenidos.\n  Agregue full para incluir detalles del proveedor, ruta de API, puntuación, evaluador y tiempo.\n  El historial está limitado a la conversación activa y no contiene texto de prompt.\n\nModos:\n  auto        clasificar cada mensaje en rutas dinámicas verificadas; de lo contrario, mantener\n              una decisión por modelo y ruta para esta conversación\n  once        mantener una decisión por modelo y ruta para esta conversación\n  always      clasificar cada nuevo mensaje del usuario\n  off         no evaluar ni cambiar solicitudes; la ruta permanece visible en el escritorio\n\nUn modo establecido aquí se aplica a las futuras solicitudes atendidas por este proceso. No se\nescribe en config.yaml (nada aquí edita sus archivos), por lo que no sobrevive a un\nreinicio; persista como plugins.entries.hermes-adaptive-effort.settings.mode en su lugar.\nLa sonda solicita al evaluador configurado una puntuación de rúbrica sobre el texto que escribió, más cualquier\nguía de clasificador configurada opcional — no usa ni almacena la conversación de su sesión, y nunca\nescribe en el estado de la sesión."
