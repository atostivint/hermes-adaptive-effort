hae.usage: "Utilisation :\n  /hae                                      Afficher l'historique des efforts de cette conversation\n  /hae history [N|all] [full]               Afficher les modifications récentes d'effort appliquées\n  /hae status                               Afficher un statut concis pour cette conversation\n  /hae status full                          Afficher un statut détaillé pour cette conversation\n  /hae status json                          Charge utile du statut lisible par machine\n  /hae auto|once|always|off                  Définir le mode utilisé par les futures requêtes\n  /hae auto|once|always|off here            Définir le mode uniquement pour cette conversation\n  /hae default here                         Réinitialiser le mode de cette conversation (utiliser la valeur par défaut)\n  /hae probe <text>                         Classer <text> une fois (affiche le score/étiquette, ne stocke rien)\n  /hae cache                                Diagnostic de perte de cache pour les 7 derniers jours\n  /hae cache json                           Diagnostic de cache lisible par machine\n  /hae help                                 Afficher cette aide\n\nHistorique :\n  La vue par défaut affiche 10 modifications appliquées. N est compris entre 1 et 64 ; all affiche les modifications conservées.\n  Ajoutez full pour inclure les détails du fournisseur, de la route API, du score, du classificateur et des temporisations.\n  L'historique est limité à la conversation active et ne contient aucun texte de prompt.\n\nModes :\n  auto        classifier chaque message sur des routes dynamiques vérifiées ; sinon conserver\n              une décision par modèle et route pour cette conversation\n  once        conserver une décision par modèle et route pour cette conversation\n  always      classifier chaque nouveau message utilisateur\n  off         ne pas évaluer ni modifier les requêtes ; la route reste visible dans Desktop\n\nUn mode défini ici s'applique aux futures requêtes servies par ce processus. Il n'est\npas écrit dans config.yaml (rien ici ne modifie vos fichiers), donc il ne survit pas à un\nredémarrage ; persistez-le en tant que plugins.entries.hermes-adaptive-effort.settings.mode à la place.\nLa sonde (probe) demande au classificateur configuré un score selon une grille pour le texte que vous avez saisi, ainsi que toute\norientation de classificateur configurée optionnelle — elle n'utilise ni ne stocke la conversation de votre session, et n'écrit\njamais dans l'état de la session."
