hae.usage: "Nutzung:\n  /hae                                      Den Effort-Verlauf dieses Gesprächs anzeigen\n  /hae history [N|all] [full]               Kürzlich angewendete Effort-Änderungen anzeigen\n  /hae status                               Einen knappen Status für dieses Gespräch anzeigen\n  /hae status full                          Einen detaillierten Status für dieses Gespräch anzeigen\n  /hae status json                          Maschinenlesbares Status-Payload\n  /hae auto|once|always|off                  Den für zukünftige Anfragen verwendeten Modus festlegen\n  /hae auto|once|always|off here            Den Modus nur für dieses Gespräch festlegen\n  /hae default here                         Den Modus dieses Gesprächs zurücksetzen (Standard verwenden)\n  /hae probe <text>                         <text> einmal klassifizieren (druckt Score/Label, speichert nichts)\n  /hae cache                                Cache-Verlust-Diagnose für die letzten 7 Tage\n  /hae cache json                           Maschinenlesbare Cache-Diagnose\n  /hae help                                 Diese Hilfe anzeigen\n\nHistorie:\n  Die Standardansicht zeigt 10 angewendete Änderungen. N ist 1–64; all zeigt die behaltenen Änderungen.\n  Fügen Sie full hinzu, um Anbieter, API-Routen, Score, Scorer und Zeitdetails einzuschließen.\n  Die Historie ist auf das aktive Gespräch beschränkt und enthält keinen Prompt-Text.\n\nModi:\n  auto        Klassifizieren Sie jede Nachricht auf verifizierten dynamischen Routen; sonst eine\n              Entscheidung pro Modell und Route für dieses Gespräch beibehalten\n  once        Eine Entscheidung pro Modell und Route für dieses Gespräch beibehalten\n  always      Jede neue Benutzer-Nachricht klassifizieren\n  off         Anfragen nicht bewerten oder ändern; Route bleibt im Desktop sichtbar\n\nEin hier gesetzter Modus gilt für zukünftige Anfragen, die von diesem Prozess bedient werden. Er wird\nnicht in config.yaml geschrieben (hier werden keine Dateien bearbeitet), überlebt also keinen Neustart;\nspeichern Sie ihn stattdessen als plugins.entries.hermes-adaptive-effort.settings.mode.\nProbe fragt den konfigurierten Scorer nach einem Rubrik-Score für den eingegebenen Text, zuzüglich eventueller\nkonfigurierter Klassifikator-Anleitungen – sie verwendet oder speichert die Konversation Ihrer Sitzung nicht und schreibt\nniemals in den Sitzungsstatus."
